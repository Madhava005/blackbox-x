<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E2E8F0"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1100" height="620" rx="16" fill="#0B1120"/>

  <!-- Header -->
  <text x="550" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">BLACKBOX-X — SYSTEM ARCHITECTURE</text>
  <text x="550" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">Zero-Code Governance, PII Firewall &amp; Self-Healing Telemetry-Drift Sidecar Proxy for Flagsmith</text>

  <!-- Top Layer: Client SDKs -->
  <rect x="260" y="88" width="580" height="66" rx="12" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
  <text x="550" y="116" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Web / Mobile / Backend Applications</text>
  <text x="550" y="138" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Flagsmith SDK  (Single 1-Line api_url Change)</text>

  <!-- Top Arrows -->
  <line x1="380" y1="154" x2="380" y2="220" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="366" y="192" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">:9000 Core APIs</text>

  <line x1="720" y1="154" x2="720" y2="220" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="734" y="192" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="start">:9080 Analytics</text>

  <!-- Middle Container: Proxy -->
  <rect x="75" y="226" width="950" height="244" rx="16" fill="#0F172A" stroke="#6366F1" stroke-width="2.5"/>
  <text x="550" y="254" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">BLACKBOX-X SIDECAR PROXY  (FastAPI Async + Threadpool)</text>

  <!-- Row 1 inside Proxy -->
  <rect x="115" y="276" width="265" height="74" rx="10" fill="#31102F" stroke="#F43F5E" stroke-width="2"/>
  <text x="247" y="306" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. PII Firewall</text>
  <text x="247" y="329" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Redact Mode / 403 Strict Block</text>

  <line x1="382" y1="313" x2="412" y2="313" stroke="#E2E8F0" stroke-width="2.2" marker-end="url(#arrow-slate)"/>

  <rect x="418" y="276" width="265" height="74" rx="10" fill="#2E1065" stroke="#A855F7" stroke-width="2"/>
  <text x="550" y="306" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Schema-Drift Guard</text>
  <text x="550" y="329" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Locks Baseline JSON Types</text>

  <line x1="685" y1="313" x2="714" y2="313" stroke="#E2E8F0" stroke-width="2.2" marker-end="url(#arrow-slate)"/>

  <rect x="720" y="276" width="265" height="74" rx="10" fill="#3B1D0E" stroke="#F59E0B" stroke-width="2"/>
  <text x="852" y="306" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Anomaly Detector</text>
  <text x="852" y="329" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Missing Keys / UUIDs / Neg Counts</text>

  <!-- Vertical Arrow to SQLite WAL -->
  <line x1="852" y1="350" x2="852" y2="374" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>

  <!-- Row 2 inside Proxy -->
  <rect x="115" y="378" width="265" height="72" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="247" y="408" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">/dashboard Command UI</text>
  <text x="247" y="430" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Live Wire Inspector &amp; Toggle</text>

  <line x1="416" y1="414" x2="386" y2="414" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>

  <rect x="418" y="378" width="265" height="72" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="550" y="408" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Rich CLI Audit</text>
  <text x="550" y="430" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">python -m app.cli</text>

  <line x1="718" y1="414" x2="689" y2="414" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>

  <rect x="720" y="378" width="265" height="72" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="852" y="408" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">SQLite WAL Storage</text>
  <text x="852" y="430" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Non-Blocking (~173 req/s)</text>

  <!-- Bottom Arrows -->
  <line x1="380" y1="470" x2="380" y2="532" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="366" y="505" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">:8000 Core</text>

  <line x1="720" y1="470" x2="720" y2="532" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="734" y="505" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="start">:8080 Analytics</text>

  <!-- Bottom Layer: Flagsmith Backend -->
  <rect x="260" y="538" width="580" height="64" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
  <text x="550" y="566" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Upstream Flagsmith Backend</text>
  <text x="550" y="588" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Receives Sanitized, Schema-Verified Traffic Only</text>
</svg>